name: Sync accepted LeetCode submissions

on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/sync-leetcode.mjs"
      - ".github/workflows/sync-leetcode.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: accepted-leetcode-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Export latest accepted submissions
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: node .github/scripts/sync-leetcode.mjs

      - name: Commit changes
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No new accepted solutions."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Sync latest accepted LeetCode submissions"
          git push origin HEAD:main
